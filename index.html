<!doctype html>
<html lang="zh_cn">
 <head>
  <meta charset="UTF-8">

  <style>
            body {
                font-family: Arial, sans-serif;
                text-align: center;
                background-color: #f0f0f0;
            }

            video {
                max-width: 100%;
                margin: 20px auto;
            }

            button {
                background-color: #4CAF50;

                color: white;

  <link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

 </head>
 <body>
  
<mdui-navigation-drawer close-on-overlay-click class="example-drawer">
   
<mdui-button>
    关闭侧边抽屉栏

<mdui-top-app-bar>

<mdui-button-icon icon="menu" id="open"></mdui-button-icon>
   -->
<mdui-top-app-bar-title>
    随机妹子视频
   </mdui-top-app-bar-title>
   <div style="flex-grow: 1"></div>
   
<mdui-button-icon icon="translate_outlined"></mdui-button-icon>
   
<mdui-button-icon icon="search"></mdui-button-icon>
   
<mdui-button-icon icon="wb_sunny_outlined"></mdui-button-icon>
   
<mdui-dropdown>
    
<mdui-button-icon slot="trigger" icon="more_vert"></mdui-button-icon>
    
<mdui-menu>
     
<mdui-menu-item icon="bubble_chart_two_tone">
      联系作者
     </mdui-menu-item>
     
<mdui-menu-item icon="catching_pokemon_two_tone">
      关于我们
     </mdui-menu-item>
    </mdui-menu>
   </mdui-dropdown>
  </mdui-top-app-bar>
  <script>
            const navigationDrawer = document.querySelector(".example-drawer");
            const opensButton = document.getElementById('open');
            const closesButton = navigationDrawer.querySelector("mdui-button");

            opensButton.addEventListener("click", () => navigationDrawer.open = true);
            closesButton.addEventListener("click", () => navigationDrawer.open = false);
        </script>
  <video id="videoPlayer" width="640" height="360" controls autoplay>
   <source src="" type="video/mp4"> 您的浏览器不支持HTML5视频。
  </video>
  <div>
   
<mdui-button onclick="changeVideo(0)" onfocus="" ondblclick="" style="">
    随机妹子1
   </mdui-button> 
<mdui-button onclick="changeVideo(1)">
    随机妹子2
   </mdui-button> 
<mdui-button onclick="changeVideo(2)">
    女大学生
   </mdui-button> 
<mdui-button onclick="changeVideo(3)">

   </mdui-button> 
<mdui-button onclick="changeVideo(4)">

<mdui-button onclick="changeVideo(8)">
    甜妹系列
   </mdui-button>
  </div>
<mdui-button variant="outlined" onclick="refreshVideo()" style="margin-top: 5px;">
   下一个视频
  </mdui-button>
  <div>
   
<mdui-button icon="search" end-icon="arrow_right" onclick="tc()">
    功能测试
   </mdui-button>
  </div>
<mdui-dialog close-on-overlay-click headline="我是标题" description="我是内容" class="example-action">
   
<mdui-button slot="action" variant="text">
    取消
   </mdui-button>
   
<mdui-button slot="action" variant="tonal" loading>
    删除
   </mdui-button>
  </mdui-dialog> 
<mdui-button>
   打开对话框
  </mdui-button>
  <script>
            const dialog = document.querySelector(".example-action");
            const openButton = dialog.nextElementSibling;

            openButton.addEventListener("click", () => dialog.open = true);
        </script>
  <script>
            const apiUrls = [
                'http://api.yujn.cn/api/zzxjj.php?type=video',
                'https://api.linhun.vip/api/Littlesistervideo?type=video&apiKey=48b0b2ef0f8483326c3c5424911d5924',
                'https://api.yujn.cn/api/nvda.php?type=video',
                'http://api.yujn.cn/api/heisis.php?type=video',
                'http://api.yujn.cn/api/manyao.php?type=video',
                'http://api.yujn.cn/api/diaodai.php?type=video',
                'http://api.yujn.cn/api/qingchun.php?type=video',
                'http://api.yujn.cn/api/nvgao.php?type=video',
                'http://api.yujn.cn/api/tianmei.php?type=video'
            ];

            let currentVideoIndex = 0;
            let currentApiIndex = 0;

            function changeVideo(index) {
                currentApiIndex = index;
                currentVideoIndex = 0;
                loadVideo();
            }

            function refreshVideo() {
                currentVideoIndex++;
                loadVideo();
            }

            function loadVideo() {
                const apiUrl = apiUrls[currentApiIndex] + '&index=' + currentVideoIndex;
                document.getElementById('videoPlayer').src = apiUrl;
            }

            function tc() {
                alert("你好");
            }
        </script>
 </body>
</html>
